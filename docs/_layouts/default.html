<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="icon" type="image/png" href="{{ '/assets/icon.png' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="28" height="28" />
        <span>Water Reminder</span>
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}#download">Download</a>
        <a href="{{ '/workflow.html' | relative_url }}">How it works</a>
        <a href="https://github.com/{{ site.repository }}">GitHub</a>
      </nav>
    </header>

    <main class="{% if page.layout_class %}{{ page.layout_class }}{% else %}doc{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>
        Free and open source under the
        <a href="https://github.com/{{ site.repository }}/blob/main/LICENSE">MIT License</a>.
        Made by Eduardo Schröder.
      </p>
    </footer>

    {% if page.mermaid %}
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script src="{{ '/assets/diagrams.js' | relative_url }}"></script>
    {% endif %}
    {% if page.downloads %}
    <script src="{{ '/assets/downloads.js' | relative_url }}"></script>
    {% endif %}
  </body>
</html>
